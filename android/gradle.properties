# ─────────────────────────────────────────────────────────────────────────────
# Gradle / JVM tuning
# OOM note: 4GB heap crashed the daemon on this machine during R8+split build.
# 2GB is the safe ceiling that matches the previous working config.
# ─────────────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC
android.useAndroidX=true
org.gradle.workers.max=2
kotlin.daemon.jvm.options=-Xmx1024m

# ── Build cache: reuse compiled outputs across clean builds ───────────
org.gradle.caching=true

# ── Parallel project execution ────────────────────────────────────────
org.gradle.parallel=false

# ── AndroidX / Jetifier ───────────────────────────────────────────────
android.enableJetifier=true

# ── R8 full mode DISABLED: crashes with OOM on machines with <8GB free RAM.
# Standard R8 (non-full) still provides significant shrinking and is stable.
# android.enableR8.fullMode=true
